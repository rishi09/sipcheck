name: Deploy CloudKit Schema

# Promotes the CloudKit schema from Development to Production so new record
# types / fields (e.g. isDeleted) go live for TestFlight + App Store builds.
# Run manually after the Development schema has the latest fields (which Xcode
# auto-creates when the app saves records in the Development environment).
#
# Requires a CloudKit *Management Token* (NOT an API token or server-to-server
# key) stored as the secret CLOUDKIT_MGMT_TOKEN. Generate it at
# https://icloud.developer.apple.com/dashboard → user menu → Manage Tokens.

on:
  workflow_dispatch:

concurrency:
  group: cloudkit-schema-production
  cancel-in-progress: false

jobs:
  deploy-schema:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (for cktool)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Export Development schema
        env:
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MGMT_TOKEN }}
          TEAM_ID: YG7C25J24J
          CONTAINER: iCloud.com.rishishah.sipcheck
        run: |
          set -euo pipefail
          if [ -z "${CLOUDKIT_MANAGEMENT_TOKEN:-}" ]; then
            echo "::error::CLOUDKIT_MGMT_TOKEN secret is not set. Generate a CloudKit Management Token in the CloudKit Console and add it as a repo secret."
            exit 1
          fi
          SCHEMA="$RUNNER_TEMP/sipcheck-development-schema.ckdb"
          for ATTEMPT in 1 2 3; do
            rm -f "$SCHEMA"
            if xcrun cktool export-schema \
              --team-id "$TEAM_ID" \
              --container-id "$CONTAINER" \
              --environment DEVELOPMENT \
              --output-file "$SCHEMA"; then
              exit 0
            fi
            if [ "$ATTEMPT" = "3" ]; then
              echo "::error::Could not export CloudKit Development schema after bounded retries."
              exit 1
            fi
            sleep $((ATTEMPT * 3))
          done

      # Keep the management token out of repository-controlled validation code.
      - name: Assert Development provenance schema
        run: |
          set -euo pipefail
          SCHEMA="$RUNNER_TEMP/sipcheck-development-schema.ckdb"
          if ! python3 scripts/assert_cloudkit_scan_schema.py "$SCHEMA"; then
            echo "::error::Development schema is missing the sourced Scan STRING fields. Save a sourced scan from a Development-signed app before promotion."
            exit 1
          fi

      - name: Promote Development schema to Production
        env:
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MGMT_TOKEN }}
          TEAM_ID: YG7C25J24J
          CONTAINER: iCloud.com.rishishah.sipcheck
        run: |
          set -euo pipefail
          SCHEMA="$RUNNER_TEMP/sipcheck-development-schema.ckdb"
          for ATTEMPT in 1 2 3; do
            if xcrun cktool validate-schema \
              --team-id "$TEAM_ID" \
              --container-id "$CONTAINER" \
              --environment PRODUCTION \
              --file "$SCHEMA"; then
              break
            fi
            if [ "$ATTEMPT" = "3" ]; then
              echo "::error::CloudKit schema validation failed after bounded retries."
              exit 1
            fi
            sleep $((ATTEMPT * 3))
          done
          for ATTEMPT in 1 2 3; do
            if xcrun cktool import-schema \
              --team-id "$TEAM_ID" \
              --container-id "$CONTAINER" \
              --environment PRODUCTION \
              --validate \
              --file "$SCHEMA"; then
              exit 0
            fi
            if [ "$ATTEMPT" = "3" ]; then
              echo "::error::CloudKit schema import failed after bounded retries."
              exit 1
            fi
            sleep $((ATTEMPT * 5))
          done

      - name: Export Production schema
        env:
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MGMT_TOKEN }}
          TEAM_ID: YG7C25J24J
          CONTAINER: iCloud.com.rishishah.sipcheck
        run: |
          set -euo pipefail
          SCHEMA="$RUNNER_TEMP/sipcheck-production-schema.ckdb"
          for ATTEMPT in 1 2 3 4 5 6; do
            rm -f "$SCHEMA"
            if xcrun cktool export-schema \
              --team-id "$TEAM_ID" \
              --container-id "$CONTAINER" \
              --environment PRODUCTION \
              --output-file "$SCHEMA"; then
              exit 0
            fi
            if [ "$ATTEMPT" = "6" ]; then
              echo "::error::Could not export CloudKit Production schema after bounded retries."
              exit 1
            fi
            sleep $((ATTEMPT * 5))
          done

      - name: Assert Production provenance schema
        run: |
          set -euo pipefail
          SCHEMA="$RUNNER_TEMP/sipcheck-production-schema.ckdb"
          if ! python3 scripts/assert_cloudkit_scan_schema.py "$SCHEMA"; then
            echo "::error::Production schema is missing the sourced Scan STRING fields after import."
            exit 1
          fi
          echo "CloudKit schema promoted Development to Production."
