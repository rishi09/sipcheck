name: TestFlight

# ⚠️ SECURITY: this workflow has access to signing/API secrets. Keep its triggers
# to `push` (trusted branches) and `workflow_dispatch` ONLY. Do NOT add a
# `pull_request` (or `pull_request_target`) trigger here, and never echo a secret
# in a step — either would expose the signing cert / API keys, especially while
# the repo is public.
on:
  push:
    branches: [main, 'codex/**', 'claude/**', 'cli/**']
    # Doc/report/tooling-only pushes don't need a 25-min macOS build +
    # TestFlight upload. `.drive/**` is the E2E/motion session git-dispatch
    # channel; `scripts/**` is CI tooling — neither ships in the app.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'plans/**'
      - 'scripts/**'
      - '.drive/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      live_search_smoke:
        description: Run the live connected-search capability smoke test
        required: false
        type: boolean
        default: false

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  # Gate the build on the App Store Connect secrets existing, so pushes don't
  # fail loudly before the one-time secret setup is done. Runs on cheap Linux.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$DIST_CERT_P12_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing secrets. Need ASC_KEY_ID/ASC_ISSUER_ID/ASC_KEY_CONTENT and DIST_CERT_P12_BASE64/DIST_CERT_PASSWORD (the exported Distribution certificate). Skipping the build until they're set."
          fi

  backend:
    name: Verify deployed beer-search backend
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.deployment.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test beer-search proxy source
        run: |
          npm --prefix backend ci
          npm --prefix backend test
          npm --prefix backend run typecheck

      # Vercel's Git integration builds this exact commit from the backend/
      # project root. Resolve the successful GitHub deployment for GITHUB_SHA
      # instead of trusting a mutable URL that could contain older source.
      - name: Resolve exact Vercel deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            deployments=$(gh api \
              "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&per_page=20")
            while IFS= read -r deployment_id; do
              [ -n "$deployment_id" ] || continue
              url=$(gh api \
                "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=20" \
                --jq '[.[] | select(.state == "success") | .environment_url // empty | select(startswith("https://") and contains("vercel.app"))][0] // empty')
              if [ -n "$url" ]; then
                echo "base_url=${url%/}" >> "$GITHUB_OUTPUT"
                echo "Verified Vercel deployment for ${GITHUB_SHA}: ${url%/}"
                exit 0
              fi
            done < <(jq -r '.[].id' <<<"$deployments")
            echo "Waiting for Vercel deployment for ${GITHUB_SHA} (${attempt}/60)..."
            sleep 10
          done
          echo "::error::No successful Vercel deployment was attached to ${GITHUB_SHA}."
          exit 1

  testflight:
    needs: [check-secrets, backend]
    if: needs.check-secrets.outputs.ready == 'true' && needs.backend.result == 'success'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Apple rejects uploads built with an SDK older than iOS 26 (Xcode 26+).
      # The runner defaults to an older Xcode, so select the newest installed.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify iOS SDK >= 26 (fail fast before the long build)
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK version: $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::Runner's newest Xcode provides iOS SDK $SDK (<26). App Store uploads require the iOS 26 SDK. Need a runner image with Xcode 26."
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: bundle install

      # Secrets.swift is gitignored and absent from a clean checkout, but it is a
      # required compile input. Provider keys remain necessary for scan fallback;
      # connected beer search now uses the key-safe SipCheck proxy below.
      - name: Generate Secrets.swift
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        run: |
          cat > SipCheck/Secrets.swift <<EOF
          import Foundation

          enum Secrets {
              static let openAIAPIKey = "${OPENAI_API_KEY}"
              static let manusAPIKey = "${MANUS_API_KEY}"
              static let geminiAPIKey = "${GEMINI_API_KEY}"
          }
          EOF
          echo "Wrote SipCheck/Secrets.swift (openAI set: $([ -n "$OPENAI_API_KEY" ] && echo yes || echo no), gemini set: $([ -n "$GEMINI_API_KEY" ] && echo yes || echo no))"

      # OpenAI remains the bounded network fallback for label-image extraction.
      # Search itself no longer calls OpenAI or embeds a search-provider key.
      - name: Validate scan-fallback OpenAI key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is required for the scan fallback."
            exit 1
          fi
          RESPONSE=$(mktemp)
          trap 'rm -f "$RESPONSE"' EXIT
          if ! STATUS=$(curl --silent --show-error --output "$RESPONSE" --write-out '%{http_code}' \
            --retry 2 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 \
            https://api.openai.com/v1/responses \
            --header "Authorization: Bearer ${OPENAI_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"model":"gpt-5.4-mini","reasoning":{"effort":"low"},"input":"Reply with only OK.","max_output_tokens":64,"store":false}'); then
            echo "::error::Could not verify the scan-fallback Responses capability after bounded retries."
            exit 1
          fi
          if [ "$STATUS" = "200" ]; then
            echo "Scan-fallback Responses capability authenticated."
          else
            echo "::error::Scan-fallback Responses capability failed (HTTP ${STATUS}); refresh or re-scope OPENAI_API_KEY."
            exit 1
          fi

      # Health checks verify the deployed contract without spending Tavily
      # credits on every branch push.
      - name: Validate deployed beer-search proxy
        env:
          BEER_SEARCH_BASE_URL: ${{ needs.backend.outputs.base_url }}/api
        run: |
          set -euo pipefail
          RESPONSE=$(mktemp)
          trap 'rm -f "$RESPONSE"' EXIT
          STATUS=$(curl --silent --show-error --output "$RESPONSE" --write-out '%{http_code}' \
            --retry 2 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 \
            "${BEER_SEARCH_BASE_URL}/health")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Beer-search proxy health check failed (HTTP ${STATUS})."
            exit 1
          fi
          if ! jq -e '
            .status == "ok"
            and .contract == "tavily-gemini-v1"
            and .providers.tavily == true
            and .providers.gemini == true
          ' "$RESPONSE" >/dev/null; then
            echo "::error::Beer-search proxy is missing a required provider configuration."
            exit 1
          fi
          echo "Beer-search proxy is healthy."

      # Spend one Advanced-search request only for a release, or when explicitly
      # requested on a task branch. Validate facts and provenance, not wording.
      - name: Smoke test connected beer discovery
        if: ${{ github.ref == 'refs/heads/main' || inputs.live_search_smoke == true }}
        env:
          BEER_SEARCH_URL: ${{ needs.backend.outputs.base_url }}/api/beer-search
        run: |
          set -euo pipefail
          RESPONSE=$(mktemp)
          trap 'rm -f "$RESPONSE"' EXIT
          STATUS=$(curl --silent --show-error --output "$RESPONSE" --write-out '%{http_code}' \
            --retry 2 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            --connect-timeout 10 --max-time 60 \
            "$BEER_SEARCH_URL" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data '{"query":"Jantar Cohesion Brewing Company","limit":3}')
          if [ "$STATUS" != "200" ]; then
            echo "::error::Live beer-search probe failed (HTTP ${STATUS})."
            exit 1
          fi
          if ! jq -e '
            (.results | type == "array")
            and any(.results[];
              (.name | test("^Jantar"; "i"))
              and (.brewery | ascii_downcase | contains("cohesion"))
              and (.style | type == "string" and length > 0)
              and (.source_url | type == "string" and startswith("https://"))
            )
          ' "$RESPONSE" >/dev/null; then
            echo "Returned results: $(jq -c '(.results // []) | map(del(.image_url))' "$RESPONSE")"
            echo "::error::Live beer-search probe returned no sourced scorer-ready Jantar result."
            exit 1
          fi
          echo "Live beer-search contract returned sourced facts for local scoring."

      # Spend a second bounded search only alongside the release/manual live
      # smoke. This proves that an exact beer + brewery can produce reference
      # artwork and that the returned public-HTTPS-shaped URL serves an image the
      # iOS ImageIO path can decode. Redirects are followed manually only while
      # they stay on the original host, matching the app's loader policy.
      - name: Smoke test connected beer artwork
        if: ${{ github.ref == 'refs/heads/main' || inputs.live_search_smoke == true }}
        env:
          BEER_SEARCH_URL: ${{ needs.backend.outputs.base_url }}/api/beer-search
        run: |
          set -euo pipefail
          SEARCH_RESPONSE=$(mktemp)
          IMAGE_BODY=$(mktemp)
          IMAGE_HEADERS=$(mktemp)
          trap 'rm -f "$SEARCH_RESPONSE" "$IMAGE_BODY" "$IMAGE_HEADERS"' EXIT

          STATUS=$(curl --silent --show-error --output "$SEARCH_RESPONSE" --write-out '%{http_code}' \
            --retry 2 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            --connect-timeout 10 --max-time 60 \
            "$BEER_SEARCH_URL" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data '{"query":"Sierra Nevada Pale Ale Sierra Nevada Brewing Company","limit":5}')
          if [ "$STATUS" != "200" ]; then
            echo "::error::Live beer-artwork search probe failed (HTTP ${STATUS})."
            exit 1
          fi

          IMAGE_URL=$(jq -r '
            [
              .results[]?
              | select(
                  ((.name? // "") | test("^(Sierra Nevada )?Pale Ale$"; "i"))
                  and ((.brewery? // "") | test("Sierra Nevada"; "i"))
                  and ((.image_url? // "") | startswith("https://"))
                )
              | .image_url
            ][0] // empty
          ' "$SEARCH_RESPONSE")
          if [ -z "$IMAGE_URL" ]; then
            echo "Returned results: $(jq -c '(.results // []) | map(del(.image_url))' "$SEARCH_RESPONSE")"
            echo "::error::Live beer-artwork probe returned no exact Sierra Nevada Pale Ale image_url."
            exit 1
          fi

          ORIGINAL_HOST=$(ruby -ruri -e '
            url = URI(ARGV.fetch(0))
            abort unless url.scheme == "https" && url.host && url.userinfo.nil? && url.port == 443
            puts url.host.downcase
          ' "$IMAGE_URL")
          CURRENT_URL="$IMAGE_URL"
          IMAGE_STATUS=""
          IMAGE_MIME=""

          # Fetch one response at a time so every hop is revalidated. Curl's
          # normal --location mode exposes only the final host and could hide a
          # cross-host intermediate redirect that the iOS delegate rejects.
          for HOP in 0 1 2 3 4 5; do
            : > "$IMAGE_BODY"
            : > "$IMAGE_HEADERS"
            if ! FETCH_META=$(curl --silent --show-error --output "$IMAGE_BODY" \
              --dump-header "$IMAGE_HEADERS" \
              --write-out '%{http_code}\n%{content_type}' \
              --proto '=https' \
              --max-filesize 4194304 \
              --retry 2 --retry-all-errors --retry-delay 1 --retry-max-time 45 \
              --connect-timeout 10 --max-time 30 \
              --header 'Accept: image/avif,image/webp,image/heic,image/png,image/jpeg,image/gif' \
              "$CURRENT_URL"); then
              echo "::error::Live beer-artwork URL exceeded its size/time bounds or could not be fetched."
              exit 1
            fi

            IMAGE_STATUS=$(sed -n '1p' <<<"$FETCH_META")
            IMAGE_MIME=$(sed -n '2p' <<<"$FETCH_META" | cut -d';' -f1 | tr '[:upper:]' '[:lower:]')
            if [[ "$IMAGE_STATUS" =~ ^3[0-9][0-9]$ ]]; then
              if [ "$HOP" -ge 5 ]; then
                echo "::error::Live beer-artwork URL exceeded five redirects."
                exit 1
              fi
              LOCATION=$(awk '
                tolower($0) ~ /^location:/ {
                  sub(/\r$/, "")
                  sub(/^[^:]*:[[:space:]]*/, "")
                  value = $0
                }
                END { print value }
              ' "$IMAGE_HEADERS")
              if [ -z "$LOCATION" ]; then
                echo "::error::Live beer-artwork redirect omitted Location."
                exit 1
              fi
              if ! NEXT_URL=$(ruby -ruri -e '
                current = URI(ARGV.fetch(0))
                target = URI.join(current.to_s, ARGV.fetch(1))
                abort unless target.scheme == "https" && target.host && target.userinfo.nil? && target.port == 443
                puts target.to_s
              ' "$CURRENT_URL" "$LOCATION"); then
                echo "::error::Live beer-artwork redirect target was not a valid HTTPS URL."
                exit 1
              fi
              NEXT_HOST=$(ruby -ruri -e 'puts URI(ARGV.fetch(0)).host.downcase' "$NEXT_URL")
              if [ "$NEXT_HOST" != "$ORIGINAL_HOST" ]; then
                echo "::error::Live beer-artwork redirect changed hosts (${ORIGINAL_HOST} -> ${NEXT_HOST})."
                exit 1
              fi
              CURRENT_URL="$NEXT_URL"
              continue
            fi
            break
          done

          IMAGE_BYTES=$(wc -c < "$IMAGE_BODY" | tr -d '[:space:]')
          if [ "$IMAGE_STATUS" != "200" ]; then
            echo "::error::Live beer-artwork fetch returned HTTP ${IMAGE_STATUS}."
            exit 1
          fi
          case "$IMAGE_MIME" in
            image/jpeg|image/png|image/webp|image/heic|image/heif|image/avif|image/gif) ;;
            *)
              echo "::error::Live beer-artwork fetch returned unsupported MIME type '${IMAGE_MIME}'."
              exit 1
              ;;
          esac
          if [ "$IMAGE_BYTES" -le 0 ] || [ "$IMAGE_BYTES" -gt 4194304 ]; then
            echo "::error::Live beer-artwork fetch returned ${IMAGE_BYTES} bytes; expected 1..4194304."
            exit 1
          fi
          if ! IMAGE_INFO=$(sips -g pixelWidth -g pixelHeight "$IMAGE_BODY" 2>/dev/null); then
            echo "::error::Live beer-artwork response could not be decoded by ImageIO."
            exit 1
          fi
          IMAGE_WIDTH=$(awk '/pixelWidth:/ { print $2 }' <<<"$IMAGE_INFO")
          IMAGE_HEIGHT=$(awk '/pixelHeight:/ { print $2 }' <<<"$IMAGE_INFO")
          if ! [[ "$IMAGE_WIDTH" =~ ^[1-9][0-9]*$ && "$IMAGE_HEIGHT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Live beer-artwork response had invalid pixel dimensions."
            exit 1
          fi
          if [ "$IMAGE_WIDTH" -gt $((24000000 / IMAGE_HEIGHT)) ]; then
            echo "::error::Live beer-artwork response exceeded the 24MP client limit (${IMAGE_WIDTH}x${IMAGE_HEIGHT})."
            exit 1
          fi
          echo "Live beer-artwork contract returned a renderable ${IMAGE_MIME} image (${IMAGE_WIDTH}x${IMAGE_HEIGHT}, ${IMAGE_BYTES} bytes)."

      - name: Build and upload to TestFlight
        env:
          # Apple caps TestFlight uploads per app per day. Branch pushes are a
          # COMPILE GATE only (SKIP_UPLOAD=true); only main spends an upload.
          # A manual branch dispatch may run a live capability smoke without
          # bypassing the verified-commit-to-main release contract.
          SKIP_UPLOAD: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: bundle exec fastlane beta

      # Concise failure diagnostics: gym's console error is captured by the job log
      # tail directly; here we only grep the IDEDistribution log for error lines so
      # the actual cause isn't buried under thousands of entitlement-eval lines.
      - name: Dump signing/export errors on failure
        if: failure()
        run: |
          echo "===== gym log tail ====="
          shopt -s nullglob
          for f in ~/Library/Logs/gym/*.log; do
            echo "----- $f -----"; tail -50 "$f" 2>/dev/null
          done
          echo "===== IDEDistribution error lines ====="
          find ~/Library/Developer/Xcode /var/folders "$TMPDIR" -iname "IDEDistribution*.log" 2>/dev/null \
            | while read -r f; do
                echo "----- $f -----"
                grep -iE "error|denied|cannot|unable|fail|forbidden|not permitted|invalid|missing| 4[0-9][0-9] " "$f" 2>/dev/null | tail -30
              done
          echo "===== done ====="
